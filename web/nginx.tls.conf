# nginx.tls.conf — PRODUCTION HTTPS variant of nginx.conf.
#
# Use this instead of nginx.conf when deploying off localhost. It terminates TLS,
# redirects HTTP→HTTPS, and forwards X-Forwarded-Proto=https. Pair it with these
# control-plane settings in .env:
#
#   COOKIE_SECURE=true                 # session cookie only sent over HTTPS
#   ALLOWED_ORIGINS=https://YOUR_HOST  # exact browser origin for the WS check
#
# Mount certificates into the container at /etc/nginx/certs/:
#   - fullchain.pem  (cert + intermediates; e.g. Let's Encrypt)
#   - privkey.pem
# For a quick self-signed pair to test the TLS path locally:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout privkey.pem -out fullchain.pem -subj "/CN=localhost"
#
# Run, e.g.:
#   docker run -d --name sandbox-ui --network host \
#     -v "$PWD/certs:/etc/nginx/certs:ro" \
#     -e NGINX_CONF=nginx.tls.conf sandbox-ui
# (or COPY this file to default.conf in the Dockerfile for a TLS-only image).

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # HSTS — force HTTPS for a year once a client has connected.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /terminal {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
