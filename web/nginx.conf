# nginx.conf — serve the built dashboard and reverse-proxy the control plane.
#
# Run the container with `--network host` so 127.0.0.1:7777 below reaches the
# control plane running on the WSL2/Linux host.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the static assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Single-page app: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API → host control plane. Host is set to $host so the control plane's
    # WebSocket same-origin check (origin host == request host) passes, and so the
    # session cookie is scoped to the browser-facing origin. Cookies are forwarded
    # by nginx automatically.
    location /api/ {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket terminal → host control plane (Upgrade/Connection for the handshake;
    # long timeouts for streaming sessions). The session cookie rides the handshake.
    location /terminal {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
