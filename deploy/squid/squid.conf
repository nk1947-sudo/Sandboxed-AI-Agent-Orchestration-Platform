# squid.conf — Phase 6: forward proxy for sandbox VM egress.
#
# Architecture:
#   Sandbox VMs have no direct internet access (firewall blocks all egress).
#   VMs needing external API access route through this proxy (port 3128).
#   The proxy enforces an explicit dstdomain allowlist and blocks:
#     - IMDS (169.254.169.254) — instance metadata, credential theft vector
#     - Private/RFC1918 addresses — SSRF protection
#     - Raw IPs (no-domain bypasses allowlist)
#     - All domains not on the allowlist
#
# Deploy:
#   apt install squid
#   cp deploy/squid/squid.conf /etc/squid/squid.conf
#   systemctl restart squid
#
# Verify:
#   curl -x http://10.200.0.1:3128 https://api.openai.com/v1/models  # 200 or 401 (allowed)
#   curl -x http://10.200.0.1:3128 http://169.254.169.254/latest/meta-data/  # DENIED
#   curl -x http://10.200.0.1:3128 https://evil.com/  # DENIED

# ── network ───────────────────────────────────────────────────────────────────

http_port 3128

# Only accept connections from the sandbox subnet.
acl sandbox_net src 10.200.0.0/24
http_access deny !sandbox_net

# ── IMDS deny (highest priority — must come before any allow) ─────────────────

acl aws_metadata dst 169.254.169.254
http_access deny aws_metadata

# ── SSRF / RFC-1918 protection ────────────────────────────────────────────────
# Block requests to private IP space to prevent sandboxes from probing
# internal services on the host network.

acl private_ips dst 10.0.0.0/8
acl private_ips dst 172.16.0.0/12
acl private_ips dst 192.168.0.0/16
acl private_ips dst 127.0.0.0/8
acl private_ips dst 100.64.0.0/10
http_access deny private_ips

# ── raw IP bypass block ────────────────────────────────────────────────────────
# Requests to bare IP addresses bypass the dstdomain allowlist.
# Block them entirely — agents must use domain names.

acl raw_ip dstdom_regex ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$
http_access deny raw_ip

# ── allowlisted external domains ──────────────────────────────────────────────
# Add only the APIs your agents legitimately need. Review changes like code.

acl allowed_apis dstdomain .openai.com
acl allowed_apis dstdomain .anthropic.com
acl allowed_apis dstdomain .huggingface.co
acl allowed_apis dstdomain .googleapis.com
acl allowed_apis dstdomain .github.com
acl allowed_apis dstdomain .githubusercontent.com
acl allowed_apis dstdomain .pypi.org
acl allowed_apis dstdomain .npmjs.com

http_access allow allowed_apis

# ── default deny all ──────────────────────────────────────────────────────────
http_access deny all

# ── SSL bump (optional — uncomment to inspect HTTPS for compliance logging) ───
# Requires a CA cert deployed to the guest agent's trust store.
#
# http_port 3129 ssl-bump cert=/etc/squid/certs/ca.pem key=/etc/squid/certs/ca.key
# ssl_bump peek all
# ssl_bump bump all
# acl step1 at_step SslBump1
# ssl_bump peek step1

# ── logging ───────────────────────────────────────────────────────────────────

access_log /var/log/squid/access.log combined
cache_log  /var/log/squid/cache.log
logformat combined %>a %[ui %[un [%tl] "%rm %ru HTTP/%rv" %>Hs %<st "%{Referer}>h" "%{User-Agent}>h"

# No caching — we're a security proxy, not a performance proxy.
cache deny all
maximum_object_size 0 KB

# ── performance ───────────────────────────────────────────────────────────────

workers 2
dns_v4_first on
positive_dns_ttl 1 minute
negative_dns_ttl 30 seconds
